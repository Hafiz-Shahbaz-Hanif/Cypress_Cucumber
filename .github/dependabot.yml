version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Cypress, the Cucumber preprocessor and the esbuild bundler have to agree on
      # versions, so they are bumped together in one PR that CI can validate as a unit.
      cypress-stack:
        patterns:
          - "cypress"
          - "@badeball/*"
          - "@bahmutov/*"
          - "esbuild"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Lint config is `.eslintrc.json`; ESLint 9+ defaults to flat config (v10 no longer
      # ships the eslintrc loader) and eslint-plugin-cypress 4+ needs ESLint 9+, so these
      # majors need a deliberate migration, not an auto-PR.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-cypress"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
